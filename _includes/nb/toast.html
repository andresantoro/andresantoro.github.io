{% comment %}A pickup notice that slides in at the bottom-left and fades (a nod to painterly RPG item notifications). Decorative: the same information is on the page, and it stays hidden with reduced motion.{% endcomment %}
<div class="nb-toast" aria-hidden="true"><span class="nb-toast__icon"></span><span><span class="nb-toast__head">{{ include.head }}</span><span class="nb-toast__text">{{ include.text }}</span></span></div>
