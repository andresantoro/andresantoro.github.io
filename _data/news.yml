- date: "July 2026"
  tag: paper
  title: "New paper in Nature Communications: Charting higher-order models of brain function"
  link: "https://www.nature.com/articles/s41467-026-75959-w"
  body: |
    <p> Our large-scale comparison of higher-order interaction metrics in brain function is now published in Nature Communications. We chart a taxonomy of redundant, synergistic, and topological metrics, show their links to brain hierarchy and molecular signatures, and demonstrate their value for fingerprinting and behavior. <a href="https://www.nature.com/articles/s41467-026-75959-w" target="_blank">Read the paper here</a>. </p>

- date: "May 2026"
  tag: preprint
  title: "New preprint: Dynamical processes and emergent behaviors in multiplex networks"
  link: "https://arxiv.org/abs/2605.04199"
  body: |
    <p> Our new review article on multiplex networks is now available on arXiv. We provide a unified perspective on dynamical processes across multiplex systems, including percolation, reaction-diffusion, synchronization, epidemic spreading, social dynamics, and games, highlighting mechanisms that generate truly multiplex emergent behaviors. <a href="https://arxiv.org/abs/2605.04199" target="_blank">Read the preprint here</a>. </p>

