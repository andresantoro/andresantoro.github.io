- date: "October 2026"
  tag: preprint
  title: "New preprint: Higher-order topology uncovers the multidimensional dynamics of naturalistic emotion"
  link: "https://www.biorxiv.org/content/10.64898/2026.09.26.754452v1"
  body: |
    <p> Happy to see this work finally out as a preprint on bioRxiv, after a few years of work! Using time-resolved higher-order topology on fMRI data recorded during naturalistic viewing of 14 films, continuously annotated across 50 affective features, we show that higher-order topology captures fine-grained affective structure, while pairwise connectivity provides a portable readout of broad arousal. It has been a pleasure to work with such a great team, and kudos to Lorenzo Zaffina, who led the project and put a great amount of work into its development. <a href="https://www.biorxiv.org/content/10.64898/2026.09.26.754452v1" target="_blank">Read the preprint here</a>. </p>

- date: "August 2026"
  tag: preprint
  title: "New preprint: Sperm whale foraging combines persistent search with flexible prey-capture tactics"
  link: "https://www.biorxiv.org/content/10.64898/2026.07.29.741536v1"
  body: |
    <p> Super happy that our new <a href="https://www.projectceti.org/" target="_blank">Project CETI</a> preprint is out on bioRxiv! Using acoustic recordings and reconstructed three-dimensional trajectories from 34 sensor-tag deployments, we show that sperm-whale foraging unfolds across two nested levels: directionally persistent search paths and flexible prey-capture tactics. <a href="https://www.biorxiv.org/content/10.64898/2026.07.29.741536v1" target="_blank">Read the preprint here</a>. </p>

