- date: "March 2026"
  tag: preprint
  title: "New preprint: Brain Fingerprints After Stroke"
  link: "https://www.biorxiv.org/content/10.64898/2026.03.27.714711v1"
  body: |
    <p> Our new preprint is finally out on bioRxiv! This collaboration, which started at EPFL a few years ago, tracked the evolution of individual-specific brain connectivity patterns over the first year after stroke. We found that each patient's unique functional connectome fingerprint stabilizes remarkably early—within just three weeks—despite ongoing system-specific reorganization and a persistent shift from healthy architecture. <a href="https://www.biorxiv.org/content/10.64898/2026.03.27.714711v1" target="_blank">Read the preprint here</a>. </p>

- date: "March 2026"
  tag: paper
  title: "New paper in Scientific Reports: Sperm Whale Birth"
  link: "https://www.nature.com/articles/s41598-025-27438-3"
  body: |
    <p> Our <a href="https://www.projectceti.org/" target="_blank">Project CETI</a> paper is now published in Scientific Reports! We documented a collaborative sperm whale birth with synchronized underwater audio, aerial drone video, and behavioral observations. The study reveals statistically significant shifts in coda vocal styles during key events, including the birth itself and interactions with pilot whales, providing unprecedented insights into cetacean social behavior and communication. <a href="https://www.nature.com/articles/s41598-025-27438-3" target="_blank">Read the paper here</a>. </p>

- date: "March 2026"
  tag: paper
  title: "New paper in Computers in Biology and Medicine"
  link: "https://www.sciencedirect.com/science/article/pii/S0010482526001691"
  body: |
    <p> Our collaboration is now published in Computers in Biology and Medicine. We developed a method for inferring subject-specific brain graphs from EEG data with small-world and scale-free network properties, achieving improved performance in motor imagery decoding and brain fingerprinting. <a href="https://www.sciencedirect.com/science/article/pii/S0010482526001691" target="_blank">Read the paper here</a>. </p>

